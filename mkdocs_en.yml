# mkdocs serve -f mkdocs_en.yml --dev-addr=127.0.0.1:8001
site_name: Intelligent Software Engineering Laboratory
site_url: https://m-zakeri.github.io/lab/en/
site_description: Intelligent Software Engineering Laboratory - Tehran Polytechnic
site_author: Morteza Zakeri
copyright: 2024 - 2025 &copy; all rights reserved.  Intelligent Software Engineering Laboratory at Tehran Polytechnic

site_dir: 'site/en/'
docs_dir: docs/en/

theme:
    name: material
    custom_dir: overrides
    language: en
    font:
        text: Roboto
        code: Roboto Mono
    logo: assets/logo-mark.png
    favicon: assets/favicon.png
    features:
      - content.tooltips
      # Navigation features
      - navigation.indexes
      - navigation.instant
      - navigation.instant.progress
      - navigation.instant.preview
      - navigation.tracking
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.top
      - navigation.path
      - navigation.footer
      #- navigation.sections
      - toc.follow
      #- toc.integrate
      # setup the search -----------------------------------------
      - search.suggest # search suggest completion
      - search.highlight # search highlight
      - search.share # deep linking

      # setup header ---------------------------------------------
      # - header.autohide # autohide header
      # - announce.dismiss
      - content.footnote.tooltips

  # Palette toggle for light mode
    palette:
      - scheme: default
        primary: custom
        accent: custom
        toggle:
            icon: material/brightness-7
            name: Switch to dark mode
   # Palette toggle for dark mode
      - scheme: slate
        primary: custom
        accent: custom
        toggle:
           icon: material/brightness-4
           name: Switch to light mode

    icon:
      annotation: material/arrow-right-circle


markdown_extensions:
  - abbr
  - admonition # support for admonitions ---> use this in markdown like this : !!! note "Note" or ??? warning "Warning"
  - pymdownx.details # support for admonitions with collapse
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  #- pymdownx.blocks.caption

  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower


nav:
    - Home: index.md
    - Services: services.md
    - Products: products.md
    - Research:
        - research/index.md
        - Publications: research/publications.md
    - People: people.md
    - Checklists:
        - checklist/index.md
        - PhD Dissertation: checklist/phd_dissertation.md
        - MSc Thesis: checklist/msc_thesis.md
        - BSc Project: checklist/bsc_project.md
    - Blog:
        - blog/index.md
    - FAQ: faq.md
    - Issues: 'https://github.com/m-zakeri/lab/issues'



plugins:
  - blog:
      enabled: true
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      pagination: true
      pagination_per_page: 10

  - search:
       lang: en

  - social:
      enabled: !ENV [CI, false]
      # The card generator maps a *named* palette colour to a card background;
      # `primary: custom` is not in that map, so it silently falls back to
      # indigo. These two keys are what keep the cards on brand.
      cards_layout_options:
        background_color: "#12325c"
        color: "#ffffff"

  # Downloads external assets (Google Fonts, GitHub avatars, twemoji) at build
  # time and serves them from this site — no third-party requests at runtime.
  - privacy:
      # The theme bundle references the mermaid CDN even when no page contains a
      # diagram; without this, 3.5 MB of unused JS is downloaded into every build.
      assets_exclude:
        - unpkg.com/mermaid@*

  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
      abstract_chars_count: 300


  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
        - no-lightbox
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false


extra:
  alternate:
    - name: EN
      link: /lab/en/
      lang: en
    - name: FA
      link: /lab/
      lang: fa

  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mortazazakeri
    - icon: fontawesome/brands/telegram
      link: https://t.me/mztel
extra_css:
    - assets/styles.css

watch:
  - docs
